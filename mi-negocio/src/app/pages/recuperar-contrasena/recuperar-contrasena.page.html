<ion-header><ion-toolbar color="primary"><ion-title>Recuperar contraseña</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <ion-card><ion-card-content>
    <h1>Restablece tu contraseña</h1>
    <form [formGroup]="formulario" novalidate>
      <ion-list>
        <ion-item><ion-input label="Correo electrónico" labelPlacement="stacked" type="email" autocomplete="email" formControlName="email"></ion-input></ion-item>
        @if (codigoEnviado) {
          <ion-item><ion-input label="Código recibido" labelPlacement="stacked" autocomplete="one-time-code" autocapitalize="characters" maxlength="10" formControlName="codigo"></ion-input></ion-item>
          <ion-item><ion-input label="Nueva contraseña" labelPlacement="stacked" type="password" autocomplete="new-password" formControlName="contrasena"></ion-input></ion-item>
        }
      </ion-list>
      @if (mensaje) { <ion-note role="status">{{ mensaje }}</ion-note> }
      @if (codigoEnviado) {
        <ion-button expand="block" type="button" [disabled]="procesando" (click)="confirmar()">Cambiar contraseña</ion-button>
      } @else {
        <ion-button expand="block" type="button" [disabled]="procesando" (click)="solicitar()">Enviar código</ion-button>
      }
    </form>
    <ion-button fill="clear" routerLink="/tabs/login">Volver a iniciar sesión</ion-button>
  </ion-card-content></ion-card>
</ion-content>
