<ion-header><ion-toolbar color="primary"><ion-title>Verificar correo</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <ion-card><ion-card-content>
    <h1>Confirma tu cuenta</h1>
    <p>Escribe el código de 10 caracteres que enviamos a tu correo.</p>
    <form [formGroup]="formulario" (ngSubmit)="confirmar()" novalidate>
      <ion-list>
        <ion-item><ion-input label="Correo electrónico" labelPlacement="stacked" type="email" formControlName="email"></ion-input></ion-item>
        <ion-item><ion-input label="Código" labelPlacement="stacked" autocomplete="one-time-code" autocapitalize="characters" maxlength="10" formControlName="codigo"></ion-input></ion-item>
      </ion-list>
      @if (mensaje) { <ion-note role="status">{{ mensaje }}</ion-note> }
      <ion-button expand="block" type="submit" [disabled]="procesando">Verificar correo</ion-button>
      <ion-button expand="block" fill="clear" type="button" [disabled]="procesando" (click)="reenviar()">Reenviar código</ion-button>
    </form>
    <ion-button fill="clear" routerLink="/tabs/login">Volver a iniciar sesión</ion-button>
  </ion-card-content></ion-card>
</ion-content>
